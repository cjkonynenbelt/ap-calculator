<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AP Calculator">
<meta name="application-name" content="ActivityPay Calculator">
<meta name="theme-color" content="#0b1c2a">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<title>ActivityPay Calculator</title>
<script>try{if(JSON.parse(localStorage.getItem('ap.theme'))==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
<style>
:root{
  --navy:#0b1c2a; --navy2:#0f2638; --navy3:#16324a;
  --ink:#1c2b39; --slate:#3d5568; --muted:#6b7a8d; --faint:#8fa5b5;
  --line:#e3e9ef; --bg:#f4f8fb; --card:#ffffff;
  --teal:#3a86a8; --teal2:#5ba3c0; --mint:#4ecdc4; --orange:#fb8500; --amber:#f5a623;
  --danger:#d64545; --good:#1f9d8f;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
/* no double-tap zoom / tap delay on controls; iOS never auto-zooms because inputs are ≥16px */
button,input,select,textarea,label,summary,a{touch-action:manipulation}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ============ REP MODE ============ */
#rep{min-height:100%;padding-top:var(--sat)}
/* dark strip behind the iPhone status bar (clock/battery are white in the home-screen app) */
#rep::before{content:"";position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--navy);z-index:25}
.topbar{position:sticky;top:var(--sat);z-index:20;display:flex;align-items:center;gap:10px;padding:10px calc(16px + var(--sar)) 10px calc(16px + var(--sal));background:rgba(244,248,251,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .mark{width:30px;height:30px;border-radius:8px;background:var(--navy);display:grid;place-items:center;flex:none}
.topbar .mark svg{width:24px;height:24px}
.topbar .ttl{font-weight:700;font-size:15px;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .ttl small{display:block;font-weight:500;font-size:12px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rep-pill{margin-left:auto;flex:none;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--slate);background:#e6eef4;padding:6px 9px;border-radius:99px}
.rep-pill svg{width:12px;height:12px}
#view{padding:14px calc(16px + var(--sar)) calc(150px + var(--sab)) calc(16px + var(--sal));max-width:640px;margin:0 auto}
/* while the iPhone keyboard is open, hide the bottom bar so it can't cover the field being typed in */
body.kb .dock{display:none}
body.kb #view{padding-bottom:40vh}
.h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:6px 2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:600}
.seg{display:flex;background:#e6eef4;border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--slate)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(12,30,45,.12)}
.field{display:block;margin-bottom:10px}
.field:last-child{margin-bottom:0}
.flabel{display:block;font-size:13px;font-weight:600;color:var(--slate);margin:0 0 5px 2px}
.finput{display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:0 12px;transition:border-color .15s}
.finput:focus-within{border-color:var(--teal);background:#fff}
.finput i{font-style:normal;color:var(--muted);font-weight:600}
.finput input,.finput select{flex:1;min-width:0;width:100%;border:0;background:transparent;outline:0;padding:12px 6px;font-size:17px}
.finput select{padding:12px 0;-webkit-appearance:none;appearance:none}
.field.big .finput input{font-size:24px;font-weight:700;padding:12px 6px}
.field.big .finput i{font-size:22px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:end}
.grid2 .flabel{font-size:12.5px;line-height:1.25;overflow-wrap:anywhere}
.h1,.flabel,.help,.card h3,#modal .box,.row .t,.row .s,.plist .item{overflow-wrap:anywhere}
.finput{min-width:0}
.grid2 .field{margin:0}
textarea.notes{width:100%;min-height:110px;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px;resize:vertical;outline:0}
textarea.notes:focus{border-color:var(--teal);background:#fff}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 2px 0;border-top:1px dashed var(--line);margin-top:10px;font-size:14px;color:var(--slate)}
.readout b{font-size:18px;color:var(--ink);white-space:nowrap}
.readout span{min-width:0}
.linkbtn{color:var(--teal);font-weight:700;font-size:14px;padding:8px 2px;min-height:44px}
details.more summary{list-style:none;color:var(--teal);font-weight:700;font-size:14px;padding:4px 2px;min-height:44px;display:flex;align-items:center;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:8px}
.results{background:linear-gradient(160deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;border:0}
.results h3{color:var(--faint)}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rbox{background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px;min-width:0}
.rbox .v{white-space:nowrap}
.rbox .k{font-size:12px;color:var(--faint);font-weight:600}
.rbox .v{font-size:22px;font-weight:800;margin-top:2px}
.rbox.hero{grid-column:1/-1;background:rgba(78,205,196,.14)}
.rbox.hero .v{font-size:34px;color:var(--mint)}
.rbox .v.neg{color:#ff8a7a}
.aprate{display:flex;justify-content:space-between;align-items:center;background:#eef6f9;border-radius:12px;padding:12px 14px}
.aprate span{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--slate);font-size:15px}
.aprate svg{width:16px;height:16px}
.aprate b{font-size:30px;font-weight:800;color:var(--teal)}
/* Earnings Calculator */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiers button{min-height:88px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tiers button span{font-size:13px;font-weight:700;color:var(--slate)}
.tiers button b{font-size:30px;font-weight:800;color:var(--ink);line-height:1.1}
.tiers button small{font-size:11px;color:var(--muted);font-weight:600}
.tiers button.on{background:var(--teal);border-color:var(--teal);box-shadow:0 4px 14px rgba(58,134,168,.3)}
.tiers button.on span,.tiers button.on b,.tiers button.on small{color:#fff}
.flow{display:flex;flex-direction:column}
.fstep{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px}
.fstep span{font-size:14px;color:var(--faint);font-weight:600;min-width:0}
.fstep b{font-size:22px;font-weight:800;white-space:nowrap}
.farrow{text-align:center;color:var(--teal2);font-size:17px;line-height:1;padding:5px 0}
.earnhero{background:rgba(78,205,196,.14);border-radius:16px;padding:18px 14px;text-align:center}
.earnhero .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#a6ece6}
.earnhero .v{font-size:52px;font-weight:800;color:var(--mint);line-height:1.05;margin-top:8px;white-space:nowrap}
.earnhero .v2{font-size:30px;font-weight:800;margin-top:6px;white-space:nowrap}
.earnhero small{font-size:16px;color:var(--faint);font-weight:700;margin-left:3px;letter-spacing:0}
.wt{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.wt th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 4px 8px;text-align:right;line-height:1.3}
.wt th:first-child,.wt td:first-child{text-align:left}
.wt td{padding:12px 4px;border-top:1px solid var(--line);text-align:right;font-weight:600}
.wt td:first-child{font-weight:700;color:var(--slate)}
.wt .sel{background:#eef8f7;color:#127a6e;font-weight:800}
.wt th.sel{background:#eef8f7;color:#127a6e;border-radius:8px 8px 0 0}
.wt tr.cur td:first-child{color:var(--teal)}
.wt.sm{font-size:13px}
.wt.sm th{font-size:10px;letter-spacing:.02em}
.wt.sm td{padding:9px 3px}
.wt.sm tr.yr td{border-top:2px solid var(--faint)}
.wt small.tl{font-size:11px;color:var(--muted);font-weight:600}
.goalres{margin-top:12px;background:var(--bg);border-radius:14px;padding:16px 14px;text-align:center}
.goalres .k{font-size:14px;color:var(--slate)}
.goalres .v{font-size:38px;font-weight:800;color:var(--teal);margin:6px 0 2px;white-space:nowrap}
.goalres .s{font-size:13px;color:var(--muted);font-weight:600}
.goalres .others{font-size:13px;color:var(--slate);margin-top:8px}
.warn{margin-top:10px;background:rgba(251,133,0,.16);color:#ffd19a;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.btn{flex:1;min-width:120px;padding:14px;border-radius:13px;font-weight:700;font-size:15px;background:#fff;border:1.5px solid var(--line);color:var(--ink);text-align:center}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--danger)}
.btn:active{transform:scale(.98)}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.sw{position:relative;width:50px;height:30px;flex:none}
.sw input{position:absolute;inset:-8px;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:99px;background:#d5dde5;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+i{background:var(--teal)}
.sw input:checked+i::after{transform:translateX(20px)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:99px;background:#e6f4f2;color:var(--good);vertical-align:middle}
.badge.confirm{background:#fff3e0;color:#b25f00}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:8px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--slate)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.plist .item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px}
.plist .item .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.plist .item .n{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .item .meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.plist .item .sv{font-weight:700;color:var(--good)}
.status{font-size:11px;font-weight:700;padding:4px 8px;border-radius:99px;background:#e6eef4;color:var(--slate);flex:none}
.status.Won{background:#e0f5ef;color:#127a5a}.status.Lost{background:#fde8e8;color:#a33}
.status.Presented,.status.Proposal{background:#e3f0f7;color:#23668a}
.status.Follow-up{background:#fff3e0;color:#9a5200}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:15px}
.search{margin-bottom:10px}
.help{font-size:13px;color:var(--muted);line-height:1.45;margin:6px 2px 0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px calc(16px + var(--sar)) calc(6px + var(--sab)) calc(16px + var(--sal))}
.show-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:608px;margin:0 auto 8px;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--teal),#2c6f8e);color:#fff;font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase;box-shadow:0 6px 18px rgba(58,134,168,.35)}
.show-btn svg{width:20px;height:20px}
.show-btn:active{transform:scale(.985)}
.tabs{display:flex;max-width:608px;margin:0 auto}
.tabs button{flex:1;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 0;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--teal)}
#toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translate(-50%,-30px);opacity:0;z-index:100;background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
#modal{position:fixed;inset:0;z-index:90;background:rgba(8,20,30,.5);display:grid;place-items:center;padding:20px}
#modal .box{background:#fff;border-radius:18px;padding:20px;max-width:360px;width:100%}
#modal h4{margin:0 0 8px;font-size:18px}
#modal p{margin:0 0 16px;color:var(--slate);font-size:15px;line-height:1.45}

/* ============ PRESENTATION MODE ============ */
.pres{position:fixed;inset:0;z-index:50;color:#fff;background:radial-gradient(120% 70% at 50% 0%,#17405a 0%,var(--navy) 55%,#07131d 100%);display:flex;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab);overflow:hidden;overflow:clip;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.pres-top{display:flex;align-items:center;gap:10px;padding:14px calc(20px + var(--sar)) 0 calc(20px + var(--sal));flex:none}
.pres-top .brand{flex:none;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.01em}
.pres-top .brand svg{width:26px;height:26px}
.pres-top .biz{margin-left:auto;min-width:0;font-size:13px;color:var(--faint);font-weight:600;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;overflow:clip}  /* off-screen slides must never make the view scroll sideways */
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:10px 26px 20px;opacity:0;transform:translateX(36px);transition:opacity .45s ease,transform .55s cubic-bezier(.2,.8,.2,1);pointer-events:none;overflow-x:hidden;overflow-y:auto;scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.slide.past{transform:translateX(-36px)}
.slide>*{max-width:560px;width:100%}
/* centre vertically when there's room; when content is taller than a small screen, start at the top and scroll */
.slide{justify-content:flex-start}
.slide::before,.slide::after{content:"";flex:1 0 0}
[data-a]{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0) * 140ms + 120ms)}
.slide.in [data-a]{opacity:1;transform:none}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal2);margin:0 0 18px}
.biz-h{font-size:clamp(30px,9vw,48px);font-weight:800;letter-spacing:-.025em;line-height:1.08;margin:0 0 30px;overflow-wrap:anywhere}
.xxl{font-size:clamp(64px,21vw,124px);font-weight:800;line-height:1;white-space:nowrap}
.mega{font-size:clamp(76px,26vw,150px);font-weight:800;line-height:.95;white-space:nowrap}
.xl{font-size:clamp(46px,15vw,84px);font-weight:800;line-height:1;white-space:nowrap}
.md{font-size:clamp(30px,10vw,46px);font-weight:800;line-height:1;white-space:nowrap}
.unit{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:12px}
.warm{color:#ffb35c}
.cool{color:#8fd3ea}
.green{color:var(--mint)}
.lbl{font-size:15px;color:var(--faint);margin-top:10px;font-weight:600}
.pillx{display:inline-block;width:auto;margin-top:26px;padding:10px 18px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-weight:700;font-size:16px}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:30px}
.tile{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:16px 12px;min-width:0}
.tile .v{white-space:nowrap}
.tile .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.tile .v{font-size:28px;font-weight:800;margin-top:6px}
.tile.dim .v{color:#b9c6d1;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(255,179,92,.7)}
.explain{font-size:18px;color:#c9d6e0;line-height:1.45;margin:26px auto 0;max-width:360px}
.explain b{color:#fff}
.glow{position:absolute;left:50%;top:44%;width:520px;height:520px;max-width:none;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(78,205,196,.22) 0%,rgba(78,205,196,0) 62%);pointer-events:none;opacity:0;transition:opacity 1.4s ease .2s}
.slide.in .glow{opacity:1}
.s-sav .hero-lbl{font-size:16px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#a6ece6;margin-top:10px}
.slines{margin-top:30px;display:grid;gap:10px}
.sline{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:15px 18px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.sline .caps{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:right}
.fine{font-size:12.5px;color:#8ea3b3;margin-top:24px;line-height:1.45}
.bars{display:flex;justify-content:center;align-items:flex-end;gap:34px;height:280px;margin-top:10px}
.bcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:110px}
.bval{font-size:26px;font-weight:800;margin-bottom:10px}
.bar{width:100%;height:0;border-radius:14px 14px 6px 6px;transition:height 1.1s cubic-bezier(.2,.8,.2,1) .35s}
.bar.cur{background:linear-gradient(180deg,#ffb35c,#e07600)}
.bar.ap{background:linear-gradient(180deg,var(--mint),var(--teal));transition-delay:.6s}
.blbl{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:12px}
.diff{margin-top:28px;font-size:19px;color:#c9d6e0}
.diff b{color:var(--mint);font-size:30px}
.arows{margin-top:6px;text-align:left}
.arow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
.arow .k{font-size:16px;color:#c9d6e0;font-weight:600}
.arow .v{font-size:26px;font-weight:800}
.arow.total{border:0;padding-top:22px}
.arow.total .k{color:#fff;font-weight:800}
.arow.total .v{font-size:36px;color:var(--mint)}
.fgrid{display:grid;gap:10px;text-align:left;margin-top:4px}
.fitem{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.fitem .ck{flex:none;width:28px;height:28px;border-radius:50%;background:rgba(78,205,196,.18);display:grid;place-items:center;color:var(--mint)}
.fitem .ck svg{width:16px;height:16px}
.fitem .ft{font-weight:700;font-size:17px}
.fitem .fd{font-size:14px;color:#aebfcc;margin-top:3px;line-height:1.35}
.fgrid.compact .fitem{padding:11px 14px}
.fgrid.compact .fd{display:none}
.h2{font-size:clamp(30px,9vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 14px;overflow-wrap:anywhere}
.arow .v,.bval{white-space:nowrap}
.slines{grid-template-columns:minmax(0,1fr)}
.lead{font-size:18px;color:#c9d6e0;line-height:1.45;margin:0 auto;max-width:400px}
.vs{display:grid;gap:10px;margin-top:28px;text-align:left}
.vs .fitem .ft small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:3px}
.fitem.muted{opacity:.7}
.fitem.muted .ck{background:rgba(255,255,255,.08);color:var(--faint)}
.contact{margin-top:22px;font-size:14px;color:#aebfcc}
.contact b{color:#fff}
.pres-nav{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px calc(16px + var(--sar)) 14px calc(16px + var(--sal))}
.pres-nav button{flex:none;min-width:92px;padding:14px 16px;border-radius:14px;font-weight:700;font-size:15px}
#pPrev{color:#c9d6e0;background:rgba(255,255,255,.06)}
#pNext{background:#fff;color:var(--navy)}
.pres-nav button:disabled{opacity:.25}
.dots{display:flex;gap:5px;justify-content:center;flex:1;min-width:0}
.dots i{flex:none;width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.25);transition:.3s}
.dots i.on{width:16px;background:#fff}
.hide-btn{position:relative;flex:none;margin-left:10px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:rgba(255,255,255,.8);padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14)}
.hide-btn svg.x{width:12px;height:12px}
.pinpad .xq{font-size:20px;font-weight:700;color:#fff;text-align:center;padding:0 24px}
.pinpad .xs{font-size:14px;color:#8ea3b3;margin-top:-12px;text-align:center;padding:0 24px}
.pinpad .xb{display:flex;flex-direction:column;gap:10px;width:min(300px,82vw)}
.pinpad .xb button{padding:15px;border-radius:14px;font-weight:700;font-size:16px;background:rgba(255,255,255,.08);color:#fff}
.pinpad .xb button.pri{background:#fff;color:var(--navy)}
.hide-btn::before{content:"";position:absolute;inset:-10px -8px}  /* bigger invisible hit area for the rep's thumb */
.hide-btn svg.ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hide-btn .ring rect{fill:none;stroke:var(--mint);stroke-width:2;stroke-dasharray:200;stroke-dashoffset:200}
.hide-btn.holding .ring rect{transition:stroke-dashoffset .9s linear;stroke-dashoffset:0}
.pinpad{position:absolute;inset:0;z-index:5;background:rgba(7,19,29,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.pinpad .pd{display:flex;gap:14px}
.pinpad .pd i{width:14px;height:14px;border-radius:50%;border:2px solid #8ea3b3}
.pinpad .pd i.f{background:#fff;border-color:#fff}
.pinpad .pinerr{min-height:20px;margin-top:-10px;font-size:14px;font-weight:700;color:#ffb35c}
.pres.locked .hide-btn{color:rgba(255,255,255,.45);background:rgba(255,255,255,.05);border-color:transparent;font-weight:600}
.lockset{margin-top:6px}
.lockerr{min-height:18px;margin:6px 2px 0;font-size:13px;font-weight:700;color:var(--danger)}
html[data-theme="dark"] .lockerr{color:#ff8a7a}
.pinpad .keys{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pinpad .keys button{height:72px;border-radius:50%;background:rgba(255,255,255,.08);font-size:26px;font-weight:600}
.pinpad .keys button.txt{font-size:14px;background:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* shorter iPhones (SE / mini): tighten slide spacing so every screen fits without scrolling */
@media (max-height:700px){
  .eyebrow{margin-bottom:12px}
  .h2{font-size:26px;margin-bottom:10px}
  .biz-h{margin-bottom:20px}
  .fitem,.fgrid.compact .fitem{padding:9px 14px}
  .fitem .ft{font-size:16px}
  .fgrid{gap:7px}
  .arow{padding:12px 4px}
  .arow.total{padding-top:16px}
  .fine{margin-top:14px}
  .contact{margin-top:12px}
  .tiles{margin-top:20px}
  .slines{margin-top:20px}
}

/* ============ REPORT ============ */
#report{position:fixed;inset:0;z-index:80;background:#e9eef2;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rtool{position:sticky;top:0;z-index:2;display:flex;gap:8px;padding:calc(10px + var(--sat)) calc(12px + var(--sar)) 10px calc(12px + var(--sal));background:var(--navy)}
.rtool .btn{min-width:0;min-height:44px;padding:11px 8px;font-size:14px}
.paper{max-width:760px;margin:6px auto 40px;background:#fff;color:var(--ink);border-radius:6px;overflow:hidden;box-shadow:0 4px 24px rgba(12,30,45,.12)}
.rp-head{background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;padding:26px 28px}
.rp-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.rp-brand svg{width:36px;height:36px}
.rp-head h1{margin:18px 0 4px;font-size:26px;letter-spacing:-.01em}
.rp-head .sub{color:#b9c9d6;font-size:14px}
.rp-body{padding:24px 28px 28px}
.rp-call{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.rp-call div{background:#eef8f7;border-radius:12px;padding:14px}
.rp-call .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#3d6b66}
.rp-call .v{font-size:24px;font-weight:800;color:#127a6e;margin-top:4px}
.rp-table{width:100%;border-collapse:collapse;margin-bottom:22px;font-size:15px}
.rp-table th,.rp-table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right}
.rp-table th:first-child,.rp-table td:first-child{text-align:left}
.rp-table th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rp-table td{font-variant-numeric:tabular-nums}
.rp-table tr.sv td{font-weight:800;color:#127a6e}
.rp-h{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.rp-feats{columns:2;column-gap:24px;padding:0;margin:0 0 22px;list-style:none}
.rp-feats li{break-inside:avoid;padding:6px 0 6px 24px;position:relative;font-size:14px}
.rp-feats li::before{content:"✓";position:absolute;left:0;color:var(--teal);font-weight:800}
.rp-feats li span{display:block;color:var(--muted);font-size:12.5px}
.rp-disc{font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:14px}
.rp-rep{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:14px;font-size:13px;color:var(--slate)}
@media (max-width:520px){.rp-call{grid-template-columns:1fr;gap:8px}.rp-call div div{margin:0}.rp-call>div{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}.rp-call .v{margin:0;font-size:22px}.rp-feats{columns:1}.rp-head,.rp-body{padding-left:18px;padding-right:18px}}
/* ============ PRESENTATION ORDER (rep only) ============ */
.olist{position:relative}
.orow{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;background:var(--card);transition:background .15s}
.orow .grip{flex:none;width:26px;height:40px;margin:-4px -2px -4px -6px;display:grid;place-items:center;color:var(--faint);touch-action:none}
.orow .grip svg{width:18px;height:18px}
.orow .on-n{color:var(--faint);font-weight:700;margin-right:2px}
.orow.off .t,.orow.off .s{opacity:.5}
.orow .skip{font-size:12px;font-weight:600;color:#b25f00;margin-top:3px}
html[data-theme="dark"] .orow .skip{color:#f5b95c}
.orow.pressing{background:var(--bg)}
.orow.dragging{position:relative;z-index:3;cursor:grabbing;background:var(--card);border-radius:12px;border-bottom-color:transparent;box-shadow:0 10px 26px rgba(12,30,45,.22),0 0 0 1.5px var(--teal)}
.orow.dragging .grip{color:var(--teal)}
body.dragging-order,body.dragging-order *{cursor:grabbing!important}
/* small iPhones (SE / mini): tighten the long earnings table so nothing spills */
@media (max-width:374px){
  .wt.sm{font-size:11.5px}
  .wt.sm th{font-size:9px;letter-spacing:0}
  .wt.sm td{padding:8px 2px}
}

/* ============ DARK MODE (rep screens; presentation is already dark) ============ */
html[data-theme="dark"]{color-scheme:dark;
  --ink:#e7eef4; --slate:#b4c4d1; --muted:#8fa3b4; --faint:#7d93a6;
  --line:#243b4f; --bg:#08131c; --card:#112231;}
html[data-theme="dark"] .topbar{background:rgba(8,19,28,.92)}

html[data-theme="dark"] .rep-pill,html[data-theme="dark"] .seg{background:#1a3043}

html[data-theme="dark"] .finput:focus-within,html[data-theme="dark"] textarea.notes:focus{background:#0d1c28}
html[data-theme="dark"] .aprate{background:#15303f}
html[data-theme="dark"] .aprate b,html[data-theme="dark"] .linkbtn,html[data-theme="dark"] details.more summary,
html[data-theme="dark"] .tabs button.on,html[data-theme="dark"] .goalres .v,html[data-theme="dark"] .wt tr.cur td:first-child{color:#6fb8d4}
html[data-theme="dark"] .badge{background:rgba(31,157,143,.2);color:#62d6c8}
html[data-theme="dark"] .badge.confirm{background:rgba(245,166,35,.18);color:#f5b95c}
html[data-theme="dark"] .sw i{background:#34495c}
html[data-theme="dark"] .chip,html[data-theme="dark"] .plist .item,html[data-theme="dark"] .btn,html[data-theme="dark"] #modal .box{background:var(--card)}
html[data-theme="dark"] .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
html[data-theme="dark"] .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
html[data-theme="dark"] .btn.danger{color:#ff8a7a}
html[data-theme="dark"] .status{background:#1a3043;color:var(--slate)}
html[data-theme="dark"] .status.Won{background:rgba(31,157,143,.2);color:#62d6c8}

html[data-theme="dark"] .results{box-shadow:0 0 0 1px var(--line)}
html[data-theme="dark"] .wt .sel,html[data-theme="dark"] .wt th.sel{background:rgba(78,205,196,.12);color:#6fe0d4}
html[data-theme="dark"] #modal{background:rgba(0,0,0,.6)}
html[data-theme="dark"] #report{background:#08131c}
/* the report is a white document (printed / shared), so it keeps the light colours */
html[data-theme="dark"] .paper{color-scheme:light;--ink:#1c2b39;--slate:#3d5568;--muted:#6b7a8d;--faint:#8fa5b5;--line:#e3e9ef;--bg:#f4f8fb;--card:#fff}
html[data-theme="dark"] .orow.dragging{box-shadow:0 10px 26px rgba(0,0,0,.55),0 0 0 1.5px var(--teal2)}

@media print{
  @page{margin:12mm}
  body{background:#fff}
  #rep,#present,#toast,#modal,.rtool{display:none!important}
  #report{position:static;background:#fff;overflow:visible}
  .paper{box-shadow:none;margin:0;max-width:none;border-radius:0}
  .rp-head,.rp-call div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){
  .slide,[data-a],.bar,.glow{transition:none!important}
}

<!-- ============ PRESENTATION MODE (customer-facing) ============ -->

  <div class="pres-top">
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#apmark"/></svg>ActivityPay</div>

<div id="report" hidden></div>

<script>
'use strict';
/* ---------------------------------------------------------------
   ActivityPay Sales — private rep tool + customer presentation
   All data lives on this device (localStorage). No network calls.
---------------------------------------------------------------- */

// Capabilities. `verified` = described on the public ActivityPay website (activitypay.co).
// Unverified items are only shown to the customer if the rep selects them after confirming availability.
const FEATURES = [
  {id:'integrated', t:'Integrated payments', d:'Payments built into the booking software you already use.', verified:true},
  {id:'channels', t:'In-person, online & mobile payments', d:'Card-present, ecommerce and mobile payments through one system.', verified:true},

  {id:'vt', t:'Virtual terminal', d:'Key in payments from any browser.', verified:false},
  {id:'token', t:'Tokenization & secure card vault', d:'Store cards securely for deposits and balances.', verified:false},
  {id:'reporting', t:'Reporting', d:'Clear visibility into transactions and fees.', verified:false},
  {id:'payouts', t:'Payout tracking', d:'See when deposits are on the way.', verified:false},
  {id:'surcharge', t:'Surcharge / dual pricing', d:'Programs to offset card acceptance costs.', verified:false},
  {id:'fraud', t:'Fraud tools', d:'Additional protection against fraudulent transactions.', verified:false},
];

const SLIDES = [
  {id:'intro', label:'Business overview', s:'Name + monthly processing', def:true},
  {id:'current', label:'Current costs', s:'Monthly + annual cost today', def:true},
  {id:'rate', label:'Effective rate', s:'Their true rate, very large', def:true},
  {id:'ap', label:'ActivityPay estimate', s:'Estimated cost + rate', def:true},
  {id:'savings', label:'Potential savings', s:'The big moment', def:true},
  {id:'compare', label:'Side-by-side comparison', s:'Simple bar comparison', def:true},
  {id:'annual', label:'Annual impact', s:'Current vs. estimated per year', def:true},
  {id:'features', label:'ActivityPay capabilities', s:'Only the ones you select below', def:true},
  {id:'funding', label:'Funding information', s:'Same & next-day funding', def:false},
  {id:'chargeback', label:'Chargeback information', s:'Activity-specific dispute support', def:false},
  {id:'surcharge', label:'Booking fee / surcharge information', s:'Offsetting costs', def:false},
  {id:'summary', label:'Final summary', s:'Recap + disclaimer', def:true},
];
const LINES = [
  {id:'m', label:'Monthly savings', def:true},
  {id:'y', label:'Annual savings', def:true},
  {id:'yN', label:'Multi-year savings (3 yrs, or until it passes $3,000)', def:true},
];
// Multi-year line: normally 3 years; if 3 years doesn't pass $3,000, extend to the fewest whole years that does.
const MULTI_YEAR_TARGET = 3000, MULTI_YEAR_BASE = 3, MULTI_YEAR_MAX = 10;
function yearsOver(annual){ return annual > 0 ? Math.max(MULTI_YEAR_BASE, Math.floor(MULTI_YEAR_TARGET / annual) + 1) : 0; }
const STATUSES = ['New','Presented','Follow-up','Statement requested','Proposal','Won','Lost'];

// ActivityPay pricing is fixed — not editable anywhere in the app.
const AP_RATE = 2.65;

// Advanced: processing pricing depends on the model on the statement
const ADV_FLAT = [['cRate','Processing rate','%'],['cTxnFee','Per-transaction fee','$']];
const ADV_IC = [
  ['icPct','Avg. interchange rate','%'],['icDollars','Interchange $ (statement)','$'],
  ['icMarkup','Markup over interchange','%'],['icTxnFee','Per-transaction fee','$'],
  ['icNetwork','Card network / assessment fees','$'],
];
// Advanced: fixed fees that apply to either model
const ADV_FEES = [
  ['cMonthly','Monthly / account fees','$'],['cGateway','Gateway fees','$'],
  ['cPci','PCI fees','$'],['cStatement','Statement fees','$'],
  ['cTerminal','Terminal / equipment','$'],['cChargeback','Chargeback fees','$'],
  ['cOther','Other fees','$'],['cSoftware','Software costs','$'],
];
const PROSPECT_NUM_KEYS = ['volume','txns','avgTicket','qRate','qTxnFee','qMonthly','aSoftware',
  ...ADV_FLAT.map(x => x[0]), ...ADV_IC.map(x => x[0]), ...ADV_FEES.map(x => x[0])];

const DEFAULT_DISCLAIMER = 'Estimates are based on the information provided and are for illustration only. They are not a quote, offer, or guarantee of pricing or savings. Actual costs depend on factors including card mix, transaction volume, average ticket, underwriting approval, and final pricing.';
const DEFAULT_SETTINGS = {repName:'', repTitle:'ActivityPay Representative', repPhone:'', repEmail:'',
  lockOn:false, pinHash:'', disclaimer:DEFAULT_DISCLAIMER};
// Presentation Lock: OFF unless the rep turns it on and sets a PIN. Only a hash of the PIN is kept on this device —
// the PIN itself is never stored, shown, or put in the page, URL, or presentation.
const pinHash = pin => { let h = 0x811c9dc5; for(const ch of 'ap-presentation-lock:' + pin){ h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); };
function normalizeLock(s){
  delete s.pin;                                   // older versions kept a plain-text code; it is removed and the lock starts OFF
  if(typeof s.pinHash !== 'string' || !/^[0-9a-f]{1,8}$/.test(s.pinHash)) s.pinHash = '';
  s.lockOn = !!s.lockOn && !!s.pinHash;
  return s;
}

/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ toast('Could not save on this device'); return false; } },
};

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Parse what was typed: "3.25", "3.25%", "$0.10", "50,000". A lone comma followed by 1–2 digits
// (e.g. "3,25" from a comma-decimal keyboard) is read as a decimal point.
const n = v => {
  let s = String(v ?? '').trim();
  if(/^[^.]*,\d{1,2}\s*%?$/.test(s) && (s.match(/,/g) || []).length === 1) s = s.replace(',', '.');
  const x = parseFloat(s.replace(/[^0-9.\-]/g,''));
  return isFinite(x) ? x : 0;
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));
function money(v, cents){
  const neg = v < 0; v = Math.abs(v);
  const s = cents ? v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})
                  : Math.round(v).toLocaleString('en-US');
  return (neg ? '−$' : '$') + s;
}
const pct = v => (isFinite(v) ? v : 0).toFixed(2) + '%';
const fmtDate = t => new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const sumKeys = (p, keys) => keys.reduce((a,k) => a + n(p[k]), 0);
// Shrink a value's font until it fits inside `box` (the value itself, or the row that holds it). Never grows past the CSS size.
function fitText(el, box = el){
  el.style.fontSize = '';
  let s = parseFloat(getComputedStyle(el).fontSize); const min = s * 0.35;
  while(box.scrollWidth > box.clientWidth + 1 && s > min){ s *= 0.93; el.style.fontSize = s.toFixed(1) + 'px'; }
}
// rules: [[valueSelector, optional closest-box selector], …]
const fitAll = (root, rules) => rules.forEach(([sel, boxSel]) => $$(sel, root).forEach(el => { const box = boxSel ? el.closest(boxSel) : el; if(box && box.clientWidth) fitText(el, box); }));
const fitRep = () => fitAll($('#view'), [['.rbox .v'], ['.readout b', '.readout'], ['.earnhero .v'], ['.earnhero .v2'], ['.goalres .v'], ['.fstep b', '.fstep'], ['.aprate b', '.aprate']]);

function newProspect(){
  const p = {id:uid(), created:Date.now(), updated:Date.now(), saved:false, mode:'quick', status:'New',
    business:'', contact:'', phone:'', email:'', bookingSoftware:'', pricingModel:'flat',
    inclSoftware:true, notes:'', features:[], slides:{}, lines:{}};
  PROSPECT_NUM_KEYS.forEach(k => p[k] = '');
  SLIDES.forEach(s => p.slides[s.id] = s.def);
  LINES.forEach(l => p.lines[l.id] = l.def);
  return p;
}

/* ---------- the calculation ---------- */
const blank = v => String(v ?? '').trim() === '';
// Transactions per month: typed count wins; otherwise volume ÷ average transaction size.
function txCount(p){
  const vol = n(p.volume);
  if(n(p.txns)) return n(p.txns);
  return n(p.avgTicket) ? vol / n(p.avgTicket) : 0;
}
function calc(p){
  const vol = n(p.volume), quick = p.mode === 'quick', tx = txCount(p), ic = !quick && p.pricingModel === 'icplus';
  let curProc, curSoft = 0, apSoft = 0, interchange = 0;
  if(quick){
    curProc = vol*n(p.qRate)/100 + tx*n(p.qTxnFee) + n(p.qMonthly);
  } else {
    const fixed = sumKeys(p, ['cMonthly','cGateway','cPci','cStatement','cTerminal','cChargeback','cOther']);
    if(ic){
      // Interchange Plus: actual interchange ($ from statement, or avg % × volume) + network fees + markup % + per-txn
      interchange = blank(p.icDollars) ? vol*n(p.icPct)/100 : n(p.icDollars);
      curProc = interchange + n(p.icNetwork) + vol*n(p.icMarkup)/100 + tx*n(p.icTxnFee) + fixed;
    } else {
      curProc = vol*n(p.cRate)/100 + tx*n(p.cTxnFee) + fixed;
    }
    curSoft = n(p.cSoftware); apSoft = n(p.aSoftware);
  }
  const apProc = vol*AP_RATE/100;
  const incl = !quick && p.inclSoftware && (curSoft || apSoft);
  const curTotal = curProc + (incl ? curSoft : 0), apTotal = apProc + (incl ? apSoft : 0);
  const monthly = curTotal - apTotal;
  const txFee = quick ? n(p.qTxnFee) : ic ? n(p.icTxnFee) : n(p.cTxnFee);
  return {vol, tx, interchange, curProc, curSoft, apProc, apSoft, incl:!!incl, curTotal, apTotal,
    curRate: vol ? curProc/vol*100 : 0, apRate: vol ? apProc/vol*100 : 0,
    monthly, annual: monthly*12, y3: monthly*36, y5: monthly*60,
    avgTicket: tx ? vol/tx : 0, missingTx: !!(txFee && !tx)};
}

/* ---------- state ---------- */
const S = {
  settings: normalizeLock(Object.assign({}, DEFAULT_SETTINGS, store.get('ap.settings', {}))),
  prospects: store.get('ap.prospects', []),
  p: store.get('ap.current', null) || newProspect(),
  tab: store.get('ap.tab', 'calc'),
  filter: 'All', q: '',
};
if('pin' in store.get('ap.settings', {})) store.set('ap.settings', S.settings);   // wipe an old plain-text code from storage
// fill any keys added in later versions
(function migrate(){ const base = newProspect(); for(const k in base) if(!(k in S.p)) S.p[k] = base[k];
  SLIDES.forEach(s => { if(!(s.id in S.p.slides)) S.p.slides[s.id] = s.def; });
  LINES.forEach(l => { if(!(l.id in S.p.lines)) S.p.lines[l.id] = l.def; }); })();

let saveTimer;
function touch(){
  S.p.updated = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistCurrent, 250);
}
function persistCurrent(){
  store.set('ap.current', S.p);
  if(S.p.saved) upsert(S.p, true);
  $('#curName').textContent = S.p.business || 'New prospect';
}
function upsert(p, quiet){
  const i = S.prospects.findIndex(x => x.id === p.id);
  const rec = clone(p);
  if(i >= 0) S.prospects[i] = rec; else S.prospects.unshift(rec);
  store.set('ap.prospects', S.prospects);
  if(!quiet) toast('Prospect saved');
}

/* ---------- UI: toast + modal ---------- */
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function ask(title, msg, ok='OK', cancel='Cancel', danger){
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<div class="box"><h4>${esc(title)}</h4><p>${esc(msg)}</p><div class="btnrow" style="margin:0">
      ${cancel ? `<button class="btn" data-r="0">${esc(cancel)}</button>` : ''}<button class="btn ${danger?'danger':'primary'}" data-r="1">${esc(ok)}</button></div></div>`;
    m.hidden = false;
    m.onclick = e => { const b = e.target.closest('[data-r]'); if(!b && e.target !== m) return; m.hidden = true; res(b ? b.dataset.r === '1' : false); };
  });
}

function updateResults(){
  const c = calc(S.p), set = (k, v, cls) => $$(`[data-out="${k}"]`).forEach(e => { e.textContent = v; if(cls !== undefined) e.classList.toggle('neg', cls); });
  const hasVol = c.vol > 0;
  set('curRate', hasVol && c.curProc ? pct(c.curRate) : '—');
  set('curProc', c.curProc ? money(c.curProc, true) : '—');
  set('apProc', hasVol ? money(c.apProc, true) : '—');
  set('icAmt', money(c.interchange, true));
  set('rCur', hasVol && c.curProc ? pct(c.curRate) : '—');
  set('rAp', pct(AP_RATE));
  const ready = c.curTotal > 0 && c.apTotal > 0;
  set('rM', ready ? money(c.monthly) : '—', c.monthly < 0);
  set('rY', ready ? money(c.annual) : '—', c.monthly < 0);
  set('rY3', ready ? money(c.y3) : '—', c.monthly < 0);
  set('rY5', ready ? money(c.y5) : '—', c.monthly < 0);
  set('rCt', c.curTotal ? money(c.curTotal) : '—');
  set('rAt', hasVol ? money(c.apTotal) : '—');
  // show the derived value in whichever transaction field is empty
  const tIn = $('input[data-k="txns"]'), aIn = $('input[data-k="avgTicket"]');
  if(tIn) tIn.placeholder = blank(S.p.txns) && c.tx ? '≈ ' + Math.round(c.tx).toLocaleString('en-US') : '0';
  if(aIn) aIn.placeholder = blank(S.p.avgTicket) && c.avgTicket ? '≈ ' + c.avgTicket.toFixed(2) : '0.00';
  const w = $('[data-out="warn"]');
  if(w){
    let msg = '';
    if(c.missingTx) msg = 'Add an average transaction size or # of transactions so the per-transaction fee is counted.';
    else if(ready && c.monthly <= 0) msg = 'The ActivityPay estimate is not lower than the current cost. Savings screens will be skipped in the presentation.';
    else if(hasVol && c.curRate > 8) msg = 'Current effective rate is above 8% — double-check the volume and fee entries.';
    else if(c.incl) msg = '';
    w.innerHTML = msg ? `<div class="warn">${esc(msg)}</div>` : '';
  }
  fitRep();
}

/* ---------- presentation setup: the ONE saved source of truth ----------
   S.pres = {order:[screen ids], on:{screen id: bool}, lines:{savings line id: bool}}, saved as 'ap.presCfg'.
   The Presentation tab edits it; Presentation Mode reads it fresh every time it opens.
   (Older versions kept a copy per prospect, so opening/creating a prospect silently reset the switches.) */
// Default sales flow: situation → cost → ActivityPay cost → savings → how it helps → capabilities → close
const DEFAULT_ORDER = ['intro','current','rate','ap','savings','compare','annual','funding','chargeback','surcharge','features','summary'];
const OLD_DEFAULT_ORDER = SLIDES.map(s => s.id);
function loadPresCfg(){
  const saved = store.get('ap.presCfg', null);
  const base = saved || {order:store.get('ap.slideOrder', []), on:S.p.slides || {}, lines:S.p.lines || {}};   // first run: carry over current choices
  let order = [];
  (Array.isArray(base.order) ? base.order : []).forEach(id => { if(DEFAULT_ORDER.includes(id) && !order.includes(id)) order.push(id); });
  if(!saved && order.join() === OLD_DEFAULT_ORDER.join()) order = [];   // never customised → use the new default flow
  DEFAULT_ORDER.forEach(id => { if(!order.includes(id)) order.push(id); });
  const on = {}, lines = {};
  SLIDES.forEach(s => on[s.id] = typeof (base.on || {})[s.id] === 'boolean' ? base.on[s.id] : s.def);
  LINES.forEach(l => lines[l.id] = typeof (base.lines || {})[l.id] === 'boolean' ? base.lines[l.id] : l.def);
  return {order, on, lines};
}
function savePresCfg(){ store.set('ap.presCfg', S.pres); }
S.pres = loadPresCfg(); savePresCfg();

// Why a screen that is switched ON still won't appear for this prospect ('' = it will appear).
function slideSkipReason(id, c, p){
  const pos = c.monthly > 0.5;
  if((id === 'savings' || id === 'compare' || id === 'annual') && !pos)
    return c.curTotal && c.apTotal ? 'Skipped for this prospect — no savings at these numbers' : 'Appears once current costs and volume are entered';
  if(id === 'savings' && !LINES.some(l => S.pres.lines[l.id] && (l.id !== 'yN' || yearsOver(c.annual) <= MULTI_YEAR_MAX)))
    return 'Skipped — turn on at least one savings line below';
  if(id === 'features' && !p.features.length) return 'Skipped — select capabilities below';
  return '';
}
const GRIP = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>';

    <div class="olist">${cfg.order.map((id,i) => { const s = SLIDES.find(x => x.id === id), isOn = cfg.on[id], skip = isOn ? slideSkipReason(id, c, p) : ''; return `

  h += `<div class="card"><h3>On the savings screen</h3>${LINES.map(l => `
    <div class="row"><div class="grow"><div class="t">${l.label}</div><div class="s">${c.monthly > 0 ? (l.id==='m' ? money(c.monthly) : l.id==='y' ? money(c.annual)

/* ---------- TAB: Earnings Calculator (private — never shown in Presentation Mode) ---------- */
const EARN_TIERS = [{id:1, pct:30}, {id:2, pct:40}, {id:3, pct:50}];
const EARN_STD_COST = '2.00', EARN_STD_MARGIN = '0.65';
const EARN_DEFAULTS = {volume:'100,000', cost:EARN_STD_COST, margin:EARN_STD_MARGIN, tier:1, goal:'1000', goalCustom:'',
  projGp:'270', projNew:'10', projAtt2:'5', projAtt3:'10', projYears:7};
const EARN_GOALS = [500, 1000, 2000, 5000];
const EARN_WHATIF = [25000, 50000, 100000, 250000, 500000, 1000000];
S.e = Object.assign({}, EARN_DEFAULTS, store.get('ap.earn', {}));
function saveEarn(){ store.set('ap.earn', S.e); }
const tierPct = id => (EARN_TIERS.find(t => t.id === id) || EARN_TIERS[0]).pct;
const stdMargin = cost => Math.round((AP_RATE - n(cost)) * 10000) / 10000;   // 2.65 − cost
const marginIsStandard = () => Math.abs(n(S.e.margin) - stdMargin(S.e.cost)) < 0.00005;
function earnCalc(){
  const vol = n(S.e.volume), margin = n(S.e.margin), pct = tierPct(S.e.tier);
  const avail = vol * margin / 100, monthly = avail * pct / 100;
  return {vol, margin, pct, avail, monthly, annual: monthly * 12};
}
// Residual growth projection — same math as the "Agent Residuals Proforma" sheet.
// Accounts shrink each month by the yearly attrition rate compounded monthly, then new accounts are added.
// Monthly GP = accounts × GP per account. A tier applies once its GP threshold is met 3 months in a row.
const PROJ_YEARS = [3, 5, 7, 10], PROJ_RAMP = [1,3,4,4,5,5,5,5,6,7,8,9];   // year-1 new accounts per month
const PROJ_TIERS = [{id:3, pct:50, min:50000}, {id:2, pct:40, min:25000}, {id:1, pct:30, min:0}];
function projCalc(){
  const e = S.e, gpAcct = n(e.projGp), perMonth = n(e.projNew);
  const keep = r => Math.pow(1 - Math.min(Math.max(r, 0), 100) / 100, 1 / 12);
  const k2 = keep(n(e.projAtt2)), k3 = keep(n(e.projAtt3));
  const rows = []; let accts = 0, total = 0;
  for(let m = 1; m <= e.projYears * 12; m++){
    const yr = Math.ceil(m / 12);
    accts = accts * (yr === 1 ? 1 : yr === 2 ? k2 : k3) + (yr === 1 ? PROJ_RAMP[m - 1] : perMonth);
    const gp = accts * gpAcct, last3 = [gp, ...rows.slice(-2).map(r => r.gp)];
    const tier = PROJ_TIERS.find(t => last3.length === 3 && last3.every(g => g >= t.min)) || PROJ_TIERS[2];
    const pay = gp * tier.pct / 100; total += pay;
    rows.push({m, yr, accts, gp, tier, pay, total});
  }
  return rows;
}
const earnGoal = () =>S.e.goal === 'custom' ? n(S.e.goalCustom) : n(S.e.goal);
// volume needed so that volume × margin% × tier% = goal
const volumeFor = (goal, margin, pct) => margin > 0 && pct > 0 ? Math.ceil(goal / (margin / 100 * pct / 100)) : 0;
const earnMoney = v => money(v, Math.abs(Math.round(v * 100) - Math.round(v) * 100) > 0);   // cents only when there are any
const tableMoney = v => money(v, Math.abs(v) < 100 && Math.abs(Math.round(v * 100) - Math.round(v) * 100) > 0);
const shortMoney = v => v >= 1e6 ? '$' + (v / 1e6).toLocaleString('en-US', {maximumFractionDigits:1}) + 'M' : '$' + (v / 1000).toLocaleString('en-US') + 'K';

function eField(k, label, unit, opt={}){

    <span class="finput">${unit==='$'?'<i>$</i>':''}<input data-e="${k}" data-u="${unit}" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(S.e[k])}" placeholder="${opt.ph||'0'}">${unit==='%'?'<i>%</i>':''}</span></label>`;
}
// Called on every keystroke and again when a field loses focus. Card cost and margin stay linked
// (margin = 2.65% − cost) until the margin is typed to something else.
function earnInput(t){

}

function updateEarn(){
  if(S.tab !== 'earn') return;
  const e = S.e, c = earnCalc(), set = (k, v, html) => $$(`[data-eo="${k}"]`).forEach(el => html ? el.innerHTML = v : el.textContent = v);
  set('vol', money(c.vol));
  set('margin', c.margin.toFixed(2) + '%');
  set('avail', earnMoney(c.avail));
  set('tier', `Tier ${e.tier} — ${c.pct}%`);
  set('monthly', earnMoney(c.monthly));
  set('annual', earnMoney(c.annual));
  set('whatifMargin', c.margin.toFixed(2) + '%');
  const sm = stdMargin(e.cost);
  set('marginNote', e._linked
    ? `${e.cost === EARN_STD_COST && e.margin === EARN_STD_MARGIN ? '<b>Standard default.</b> ' : ''}Margin = ${AP_RATE.toFixed(2)}% − ${n(e.cost).toFixed(2)}% = <b>${sm.toFixed(2)}%</b>. Changing the card cost updates it automatically.`
    : `<b>Custom margin.</b> The standard would be ${AP_RATE.toFixed(2)}% − ${n(e.cost).toFixed(2)}% = ${sm.toFixed(2)}%.`, true);
  const note = $('[data-eo="marginNote"]');
  if(note && !(e.cost === EARN_STD_COST && e.margin === EARN_STD_MARGIN && e._linked))
    note.insertAdjacentHTML('beforeend', ` <button class="linkbtn" data-act="earnReset">Reset to standard (2.00% / 0.65%)</button>`);
  set('warn', c.margin <= 0 ? '<div class="warn">The commissionable margin is zero or negative, so there are no earnings to calculate.</div>' : '', true);
  set('whatif', EARN_WHATIF.map(v => `<tr class="${v === c.vol ? 'cur' : ''}"><td>${shortMoney(v)}</td>${EARN_TIERS.map(t =>
    `<td class="${e.tier===t.id?'sel':''}">${tableMoney(v * c.margin / 100 * t.pct / 100)}</td>`).join('')}</tr>`).join(''), true);
  const goal = earnGoal(), need = volumeFor(goal, c.margin, c.pct);
  set('goalLabel', goal > 0 ? `To earn <b>${earnMoney(goal)}/month</b> at Tier ${e.tier} (${c.pct}%), you need about` : 'Enter a monthly earnings goal', true);
  set('need', goal > 0 && need ? money(need) : '—');
  set('needOthers', goal > 0 && c.margin > 0 ? EARN_TIERS.filter(t => t.id !== e.tier).map(t => `Tier ${t.id}: ${money(volumeFor(goal, c.margin, t.pct))}`).join(' · ') : '');
  const rows = projCalc(), end = rows[rows.length - 1], cents = v => money(v, true);
  set('projEnd', money(end.pay));
  set('projSub', `${Math.round(end.accts).toLocaleString('en-US')} accounts · Tier ${end.tier.id} (${end.tier.pct}%) · ${money(end.total)} earned over ${e.projYears} years`);
  set('projYears', rows.filter(r => r.m % 12 === 0).map(r => {
    const yearTotal = rows.filter(x => x.yr === r.yr).reduce((a, x) => a + x.pay, 0);
    return `<tr><td>${r.yr}</td><td>${Math.round(r.accts)}</td><td>${money(r.gp)}</td><td>${money(r.pay)}<br><small class="tl">Tier ${r.tier.id} · ${r.tier.pct}%</small></td><td>${money(yearTotal)}</td></tr>`;
  }).join(''), true);
  fitRep();
  set('projMonths', rows.map(r => `<tr class="${r.m % 12 === 1 ? 'yr' : ''}"><td>${r.m}</td><td>${Math.round(r.accts)}</td><td>${cents(r.gp)}</td><td>${r.tier.pct}%</td><td>${cents(r.pay)}</td></tr>`).join(''), true);
}

const view = $('#view');

view.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.slide){ S.pres.on[t.dataset.slide] = t.checked; savePresCfg(); renderPres(true); }
  else if(t.dataset.line){ S.pres.lines[t.dataset.line] = t.checked; savePresCfg(); renderPres(true); }
  else if(t.dataset.lock !== undefined){ lockSwitch(t.checked); }
  else if(t.dataset.feat){
    const f = S.p.features, id = t.dataset.feat, feat = FEATURES.find(x => x.id === id);
    if(t.checked){
      if(!feat.verified){
        ask('Confirm availability', `“${feat.t}” isn’t described on ActivityPay’s public website. Only show it if you’ve confirmed it’s available for this merchant.`, 'Confirmed — show it', 'Cancel')
          .then(ok => { if(ok){ f.push(id); touch(); } renderPres(true); });
        return;
      }
      if(!f.includes(id)) f.push(id);
    } else S.p.features = f.filter(x => x !== id);

function tidyNumber(t){
  const u = t.dataset.u;
  if(t.value.trim() === '') return;
  const v = n(t.value);
  if(u === '#') t.value = Math.round(v).toLocaleString('en-US');
  else if(u === '%'){                                                       // keep as typed: "3.25%" → "3.25", "3,25" → "3.25", "1.80" stays
    const raw = t.value.replace(/[%\s]/g, '').replace(/^(\d*),(\d{1,2})$/, '$1.$2');
    t.value = /^\d*\.?\d*$/.test(raw) && raw !== '.' ? raw : String(v);
  }
  else t.value = Number.isInteger(v) ? v.toLocaleString('en-US')           // 50000 → "50,000"
    : v.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); // .1 → "0.10"
}

/* ---------- drag-and-drop presentation order ----------
   Touch (iPhone): press and hold a screen ~0.3 s (or touch the grip), then drag. Moving before the hold
   completes is treated as a normal page scroll. While dragging, page scrolling is blocked.
   Mouse: drag a screen (or its grip) up or down. The on/off switch never starts a drag. */
const Drag = (function(){
  let d = null, pend = null, raf = 0;
  const HOLD = 300, SLOP = 8;
  const startable = t => { const row = t.closest && t.closest('.orow'); return row && !t.closest('.sw') ? row : null; };
  function begin(row, y){
    const list = row.parentElement, r = row.getBoundingClientRect();
    d = {row, list, y, grab: y - r.top};
    row.classList.add('dragging'); document.body.classList.add('dragging-order');
    follow();
    const edge = () => { if(!d) return;                                  // auto-scroll near the top / bottom edge
      const dy = d.y < 110 ? -9 : d.y > innerHeight - 190 ? 9 : 0;
      if(dy){ window.scrollBy(0, dy); move(d.y); } raf = requestAnimationFrame(edge); };
    raf = requestAnimationFrame(edge);
  }
  function follow(){                                                      // keep the lifted row under the finger
    d.row.style.transform = 'none';
    const top = d.row.getBoundingClientRect().top;
    d.row.style.transform = `translateY(${d.y - d.grab - top}px)`;
  }
  function move(y){
    d.y = y;
    const others = $$('.orow', d.list).filter(r => r !== d.row);
    const before = others.find(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; }) || null;
    if((before ? d.row.nextElementSibling !== before : d.list.lastElementChild !== d.row)){
      const first = new Map(others.map(r => [r, r.getBoundingClientRect().top]));     // animate the rows that shift
      d.list.insertBefore(d.row, before);
      others.forEach(r => { const dy = first.get(r) - r.getBoundingClientRect().top; if(!dy) return;
        r.style.transition = 'none'; r.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(() => { r.style.transition = 'transform .18s ease'; r.style.transform = ''; }); });
    }
    follow();
  }
  function finish(){
    clearPending();
    if(!d) return;
    cancelAnimationFrame(raf);
    const ids = $$('.orow', d.list).map(r => r.dataset.id);
    d.row.classList.remove('dragging'); document.body.classList.remove('dragging-order'); d = null;
    S.pres.order = ids; savePresCfg(); renderPres(true);
  }
  function clearPending(){ if(pend){ clearTimeout(pend.timer); pend.row.classList.remove('pressing'); pend = null; } }

  // touch
  view.addEventListener('touchstart', e => {
    if(e.touches.length !== 1 || d) return;
    const row = startable(e.target); if(!row) return;
    const t = e.touches[0];
    if(e.target.closest('.grip')){ e.preventDefault(); begin(row, t.clientY); return; }
    pend = {row, x:t.clientX, y:t.clientY, timer:setTimeout(() => { const p = pend; pend = null; p.row.classList.remove('pressing'); begin(p.row, p.y); }, HOLD)};
    row.classList.add('pressing');
  }, {passive:false});
  document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if(d){ e.preventDefault(); move(t.clientY); return; }                   // dragging: the page must not scroll
    if(pend && (Math.abs(t.clientX - pend.x) > SLOP || Math.abs(t.clientY - pend.y) > SLOP)) clearPending();   // it's a scroll
    else if(pend){ pend.y = t.clientY; }
  }, {passive:false});
  document.addEventListener('touchend', finish);
  document.addEventListener('touchcancel', finish);
  view.addEventListener('contextmenu', e => { if(e.target.closest && e.target.closest('.orow')) e.preventDefault(); });

  // mouse / pen (touch is handled above)
  view.addEventListener('pointerdown', e => {
    if(e.pointerType === 'touch' || e.button !== 0 || d) return;
    const row = startable(e.target); if(!row) return;
    e.preventDefault();
    pend = {row, x:e.clientX, y:e.clientY, mouse:true, timer:0};
  });
  document.addEventListener('pointermove', e => {
    if(e.pointerType === 'touch') return;
    if(d){ e.preventDefault(); move(e.clientY); return; }
    if(pend && pend.mouse && Math.abs(e.clientY - pend.y) > 4){ const p = pend; pend = null; begin(p.row, p.y); move(e.clientY); }
  });
  document.addEventListener('pointerup', e => { if(e.pointerType !== 'touch') finish(); });
  return {active: () => !!d};
})();

function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function exportBackup(){
  download(`activitypay-prospects-${new Date().toISOString().slice(0,10)}.json`,
    JSON.stringify({app:'activitypay-sales', v:1, exported:Date.now(), settings:S.settings, prospects:S.prospects}, null, 2), 'application/json');

function importBackup(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result); if(!Array.isArray(d.prospects)) throw 0;
      if(!(await ask('Import backup?', `${d.prospects.length} prospect(s) will be merged with the ${S.prospects.length} on this device (newer copies win).`, 'Import'))) return;
      d.prospects.forEach(p => { const i = S.prospects.findIndex(x => x.id === p.id); if(i < 0) S.prospects.push(p); else if((p.updated||0) > (S.prospects[i].updated||0)) S.prospects[i] = p; });
      store.set('ap.prospects', S.prospects);
      if(d.settings && await ask('Also import settings?', 'Replace your rep details, default pricing and disclaimer with the backup’s?', 'Replace', 'Keep mine')){
        S.settings = normalizeLock(Object.assign({}, DEFAULT_SETTINGS, d.settings)); store.set('ap.settings', S.settings); }
      toast('Backup imported'); renderSettings();
    }catch(e){ toast('That file isn’t a valid backup'); }
  };
  r.readAsText(file);
}

  $('#pBiz').textContent = S.p.business;
  $('#present').classList.toggle('locked', !!(S.settings.lockOn && S.settings.pinHash));
  $('#hideBtn').setAttribute('aria-label', S.settings.lockOn ? 'Exit presentation (PIN required)' : 'Exit presentation');
  $('#rep').hidden = true; $('#present').hidden = false;
  fitPresentation();
  document.querySelector('meta[name=theme-color]').content = '#0b1c2a';
  store.set('ap.presenting', Date.now());
  if(S.p.status === 'New'){ S.p.status = 'Presented'; touch(); }
  P.i = -1; goSlide(0);
  try{ if('wakeLock' in navigator) P.wake = await navigator.wakeLock.request('screen'); }catch(e){}
}
// Big numbers shrink until they fit their box (e.g. $1,250,000 on a phone). Counters are measured at their final value.
function fitPresentation(){
  if($('#present').hidden) return;
  const st = $('#stage');
  $$('[data-count]', st).forEach(el => { const v = parseFloat(el.dataset.count); el.textContent = el.dataset.fmt === 'pct' ? pct(v) : money(v); });
  fitAll(st, [['.xxl'], ['.mega'], ['.xl'], ['.md', '.sline'], ['.tile .v'], ['.arow .v', '.arow'], ['.bval', '.bcol']]);
  $$('.slide:not(.in) [data-count]', st).forEach(el => el.textContent = el.dataset.fmt === 'pct' ? pct(0) : money(0));
}
function hideCustomer(){
  $$('.pinpad', $('#present')).forEach(x => x.remove());
  $('#present').hidden = true; $('#rep').hidden = false; $('#stage').innerHTML = '';
  store.set('ap.presenting', false);
  try{ P.wake && P.wake.release(); }catch(e){} P.wake = null;
  go(S.tab);
}

function goSlide(i){
  if(i < 0 || i >= P.slides.length || i === P.i) return;
  P.i = i;
  $('#present').scrollLeft = 0; $('#stage').scrollLeft = 0;
  $$('.slide', $('#stage')).forEach((el, k) => {
    el.classList.toggle('active', k === i); el.classList.toggle('past', k < i);
    if(k !== i){ el.classList.remove('in'); $$('.bar', el).forEach(b => b.style.height = '0px'); }
  });
  const el = $(`.slide[data-i="${i}"]`);
  el.scrollTop = 0;
  // rAF doesn't fire while the page is backgrounded, so a timer backs it up
  let entered = false;
  const enter = () => {
    if(entered || P.i !== i) return; entered = true;
    el.classList.add('in');
    $$('.bar', el).forEach(b => b.style.height = b.dataset.h + 'px');
    $$('[data-count]', el).forEach(runCount);
  };
  requestAnimationFrame(() => requestAnimationFrame(enter));
  setTimeout(enter, 80);
  $$('#dots i').forEach((d, k) => d.classList.toggle('on', k === i));
  $('#pPrev').disabled = i === 0;
  $('#pNext').textContent = i === P.slides.length - 1 ? 'Done' : 'Next →';
}
function runCount(el){
  const to = parseFloat(el.dataset.count), fmt = el.dataset.fmt, f = v => fmt === 'pct' ? pct(v) : money(v);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = f(to); return; }
  const dur = 1100, delay = 250, t0 = performance.now() + delay;
  el.textContent = f(0);
  setTimeout(() => { if(el.isConnected) el.textContent = f(to); }, delay + dur + 150); // guaranteed final value
  const tick = now => {
    if(!el.isConnected) return;
    const t = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - t, 3);
    el.textContent = f(to * e);
    if(t < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

$('#pNext').addEventListener('click', () => P.i === P.slides.length - 1 ? requestExit() : goSlide(P.i + 1));
$('#pPrev').addEventListener('click', () => goSlide(P.i - 1));
(function swipe(){
  let x0, y0, t0;
  const st = $('#stage');
  st.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; t0 = Date.now(); }, {passive:true});
  st.addEventListener('touchend', e => {
    if(x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3 && Date.now() - t0 < 800) goSlide(P.i + (dx < 0 ? 1 : -1));
  }, {passive:true});
})();
document.addEventListener('keydown', e => {
  if($('#present').hidden) return;
  if(e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goSlide(P.i + 1); }
  if(e.key === 'ArrowLeft') goSlide(P.i - 1);
  if(e.key === 'Escape') requestExit();
});
document.addEventListener('visibilitychange', async () => {
  if(!document.hidden && !$('#present').hidden && 'wakeLock' in navigator){ try{ P.wake = await navigator.wakeLock.request('screen'); }catch(e){} }
});

/* Exit: tap "Exit" (or "Done" on the last screen, or Esc).
   Presentation Lock OFF → "Leave the presentation?" confirm → Rep Mode.
   Presentation Lock ON  → "Enter Presentation PIN" → correct PIN exits; a wrong PIN stays in the presentation. */
$('#hideBtn').addEventListener('click', e => { e.preventDefault(); requestExit(); });
function requestExit(){
  if($('#present').hidden || $('.pinpad', $('#present'))) return;
  if(S.settings.lockOn && S.settings.pinHash){ pinPad(); return; }
  const box = document.createElement('div'); box.className = 'pinpad';
  box.innerHTML = `<div class="xq">Leave the presentation?</div><div class="xs">You’ll return to Rep Mode.</div>
    <div class="xb"><button class="pri" data-x="exit">Exit to Rep Mode</button><button data-x="stay">Keep presenting</button></div>`;
  box.addEventListener('click', e => {
    const k = e.target.closest('button'); if(!k) return;
    box.remove();
    if(k.dataset.x === 'exit') hideCustomer();
  });
  $('#present').appendChild(box);
}
function pinPad(){
  let entry = '', busy = false, msg = '';
  const pad = document.createElement('div'); pad.className = 'pinpad'; pad.id = 'pinPad';
  const draw = () => pad.innerHTML = `<div class="xq">Enter Presentation PIN</div><div class="pd">${[0,1,2,3].map(i => `<i class="${i<entry.length?'f':''}"></i>`).join('')}</div>
    <div class="pinerr" aria-live="assertive">${msg}</div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(d => `<button data-d="${d}">${d}</button>`).join('')}<button class="txt" data-x="c">Cancel</button><button data-d="0">0</button><button class="txt" data-x="b">⌫</button></div>`;
  const press = key => {
    if(busy) return;
    if(key === 'c'){ pad.remove(); document.removeEventListener('keydown', keys, true); return; }
    if(key === 'b'){ entry = entry.slice(0,-1); draw(); return; }
    if(!/^\d$/.test(key) || entry.length >= 4) return;
    entry += key; msg = ''; draw();
    if(entry.length === 4){
      if(pinHash(entry) === S.settings.pinHash){ document.removeEventListener('keydown', keys, true); pad.remove(); hideCustomer(); }
      else { busy = true; $('.pd', pad).classList.add('shake');
        setTimeout(() => { entry = ''; msg = 'Incorrect PIN. Try again.'; busy = false; draw(); }, 400); }
    }
  };
  const keys = e => {                                   // desktop keyboard: digits, Backspace, Esc
    if(!pad.isConnected){ document.removeEventListener('keydown', keys, true); return; }
    e.stopPropagation();
    if(/^\d$/.test(e.key)) press(e.key); else if(e.key === 'Backspace') press('b'); else if(e.key === 'Escape') press('c');
    e.preventDefault();
  };
  draw();
  pad.addEventListener('click', e => { const k = e.target.closest('button'); if(k) press(k.dataset.x || k.dataset.d); });
  document.addEventListener('keydown', keys, true);
  $('#present').appendChild(pad);
}

$('#showBtn').addEventListener('click', showCustomer);

/* ================================================================
   CUSTOMER REPORT (customer-safe: no notes, status, defaults, other prospects)
================================================================ */
function reportHTML(){
  const p = S.p, c = calc(p), r = S.settings, pos = c.monthly > 0.5;
  const feats = FEATURES.filter(f => p.features.includes(f.id));
  const mark = '<svg viewBox="0 0 100 100"><path d="M30.5 77.9A34 34 0 1 1 69.5 77.9" fill="none" stroke="#fff" stroke-width="9"/><path d="M64.4 80.8A34 34 0 0 1 35.6 80.8" fill="none" stroke="#4aa3c4" stroke-width="9"/><path d="M25 67L42 49L50 57L61 45L77 63" fill="none" stroke="#fff" stroke-width="7"/></svg>';
  return `<div class="paper">
    <div class="rp-head"><div class="rp-brand">${mark}ActivityPay</div>
      <h1>Processing Cost Estimate</h1>
      <div class="sub">Prepared for <b style="color:#fff">${esc(p.business)}</b>${p.contact ? ` · ${esc(p.contact)}` : ''} · ${fmtDate(Date.now())}</div></div>
    <div class="rp-body">
      ${pos ? `<div class="rp-call">
        <div><div class="k">Est. monthly savings</div><div class="v">${money(c.monthly)}</div></div>
        <div><div class="k">Est. annual savings</div><div class="v">${money(c.annual)}</div></div>
        <div><div class="k">Est. 3-year savings</div><div class="v">${money(c.y3)}</div></div></div>` : ''}
      <table class="rp-table">
        <tr><th></th><th>Current (estimated)</th><th>ActivityPay (estimated)</th></tr>
        <tr><td>Monthly card volume</td><td>${money(c.vol)}</td><td>${money(c.vol)}</td></tr>
        <tr><td>Monthly cost</td><td>${money(c.curTotal, true)}</td><td>${money(c.apTotal, true)}</td></tr>
        <tr><td>Effective rate</td><td>${pct(c.curRate)}</td><td>${pct(c.apRate)}</td></tr>
        <tr><td>Annual cost</td><td>${money(c.curTotal*12)}</td><td>${money(c.apTotal*12)}</td></tr>
        ${pos ? `<tr class="sv"><td>Estimated savings</td><td colspan="2">${money(c.monthly)}/month · ${money(c.annual)}/year · ${money(c.y5)} over 5 years</td></tr>` : ''}
      </table>
      ${c.incl ? `<p class="help" style="margin:-12px 0 20px">Monthly and annual costs include software (current ${money(c.curSoft)}/mo, ActivityPay estimate ${money(c.apSoft)}/mo). Effective rates reflect processing fees only.</p>` : ''}
      ${feats.length ? `<h2 class="rp-h">Relevant ActivityPay capabilities</h2><ul class="rp-feats">${feats.map(f => `<li>${f.t}<span>${f.d}</span></li>`).join('')}</ul>` : ''}
      <div class="rp-disc">${esc(r.disclaimer || DEFAULT_DISCLAIMER)}</div>
      ${r.repName || r.repPhone || r.repEmail ? `<div class="rp-rep"><div><b>${esc(r.repName)}</b>${r.repTitle ? `<br>${esc(r.repTitle)}` : ''}</div><div style="text-align:right">${esc(r.repPhone)}${r.repEmail ? `<br>${esc(r.repEmail)}` : ''}</div></div>` : ''}
    </div></div>`;
}
function openReport(){
  const miss = missingForShow(); if(miss.length){ toast('Missing: ' + miss.join(', ')); return; }
  const rp = $('#report');
  rp.innerHTML = `<div class="rtool"><button class="btn" data-r="close">Close</button><button class="btn" data-r="share">Share</button><button class="btn primary" data-r="print">Save PDF / Print</button></div>${reportHTML()}`;
  rp.hidden = false; rp.scrollTop = 0;
}
$('#report').addEventListener('click', async e => {
  const b = e.target.closest('[data-r]'); if(!b) return;
  if(b.dataset.r === 'close'){ $('#report').hidden = true; }
  else if(b.dataset.r === 'print'){ window.print(); }
  else if(b.dataset.r === 'share'){
    const p = S.p, c = calc(p), r = S.settings, pos = c.monthly > 0.5;
    const text = `ActivityPay Processing Cost Estimate — ${p.business}\n\n` +
      `Current (estimated): ${money(c.curTotal)}/month · ${pct(c.curRate)} effective rate\n` +
      `ActivityPay (estimated): ${money(c.apTotal)}/month · ${pct(c.apRate)} effective rate\n` +
      (pos ? `Estimated savings: ${money(c.monthly)}/month · ${money(c.annual)}/year · ${money(c.y3)} over 3 years\n` : '') +
      `\n${r.disclaimer || DEFAULT_DISCLAIMER}` + (r.repName ? `\n\n${r.repName}${r.repPhone ? ' · ' + r.repPhone : ''}${r.repEmail ? ' · ' + r.repEmail : ''}` : '');
    const safe = (p.business || 'estimate').replace(/[^\w]+/g, '-');
    const html = `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ActivityPay Estimate — ${esc(p.business)}</title><style>${[...document.styleSheets[0].cssRules].map(x => x.cssText).filter(t => /^(\:root|\*|body|\.paper|\.rp-|\.help|@media \(max-width: 520px\))/.test(t)).join('\n')}body{background:#e9eef2;padding:12px}</style></head><body>${reportHTML()}</body></html>`;
    const file = new File([html], `ActivityPay-Estimate-${safe}.html`, {type:'text/html'});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:'ActivityPay Estimate', text});
      else if(navigator.share) await navigator.share({title:'ActivityPay Estimate', text});
      else { await navigator.clipboard.writeText(text); toast('Summary copied'); }
    }catch(err){ if(err && err.name !== 'AbortError') toast('Sharing not available here'); }
  }
});

/* ---------- iPhone keyboard handling ---------- */
// Hide the bottom dock while typing (it would otherwise float above the keyboard and cover fields),
// and keep the focused field visible above the keyboard.
const isField = el => el && el.matches && el.matches('#rep input:not([type=checkbox]):not([type=file]), #rep textarea, #rep select');
document.addEventListener('focusin', e => {
  if(!isField(e.target)) return;
  document.body.classList.add('kb');
  const el = e.target;
  setTimeout(() => { if(document.activeElement === el) el.scrollIntoView({block:'center', behavior:'smooth'}); }, 300);
});
document.addEventListener('focusout', () => {
  setTimeout(() => { if(!isField(document.activeElement)) document.body.classList.remove('kb'); }, 80);
});

/* ---------- boot ---------- */
// Ask the browser to keep saved prospects even when storage is low (home-screen apps on iOS are already exempt from cleanup).
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
$('#curName').textContent = S.p.business || 'New prospect';
go(S.tab);
// Resume after an iOS reload mid-presentation, but only if it started recently (2 hours; 12 hours when
// Presentation Lock is on, so a customer can't escape the lock by closing the app). The PIN always exits.
const presentingSince = store.get('ap.presenting', false), resumeFor = (S.settings.lockOn ? 12 : 2) * 3600e3;
if(typeof presentingSince === 'number' && Date.now() - presentingSince < resumeFor && !missingForShow().length) showCustomer();
else store.set('ap.presenting', false);
if('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
